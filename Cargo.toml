[package]
name = "noteplay"
version = "0.2.1"
edition = "2024"
description = "A Rust crate that generates audio from notes and musical sequences, supporting tempo scheduling and custom QMid serialization for music playback in Rust applications."
license = "MIT"
repository = "https://github.com/FishgameStudio/noteplay"
readme = "README.md"

[features]
default = []
songs = []
sf2 = []
full = ["songs", "sf2"]

[lib]
name = "noteplay"
path = "src/lib.rs"
doc = true

[[example]]
name = "play_music"
path = "examples/play_music.rs"

[dependencies]
num_enum = "0.7.6"
rodio = "0.23.0"
rustysynth = "1.3.8"
thiserror = "2.0.21"
