[package]
name = "noteplay"
version = "0.1.0"
edition = "2024"
description = "A Rust crate that generates audio from notes and musical sequences, supporting tempo scheduling and custom QMid serialization for music playback in Rust applications."
license = "MIT"
repository = "https://github.com/FishgameStudio/noteplay"

[features]
default = []
songs = []
full = ["songs"]

[lib]
name = "noteplay"
path = "src/lib.rs"
doc = true

[[bin]]
name = "test"
path = "src/test.rs"

[dependencies]
rodio = "0.23.0"
thiserror = "2.0.21"
