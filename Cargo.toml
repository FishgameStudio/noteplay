[package]
name = "noteplay"
version = "0.1.0"
edition = "2024"

[features]
default = []
songs = []
full = ["songs"]

[lib]
name = "noteplay"
path = "src/lib.rs"
doc = true

[[bin]]
name = "play"
path = "src/main.rs"

[[bin]]
name = "construct_midi"
path = "src/construct_midi.rs"


[dependencies]
rodio = "0.23.0"
